group 'com.example.flutter_rust_ocr'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.flutter_rust_ocr'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    sourceSets {
        main.jniLibs.srcDirs = ['src/main/jniLibs']
    }
}
