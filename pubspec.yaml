name: flutter_rust_ocr
description: "A fast, offline, privacy-first cross-platform OCR engine for Flutter powered by Rust."
version: 0.1.0
homepage: https://github.com/perso/flutter_rust_ocr
repository: https://github.com/perso/flutter_rust_ocr
issue_tracker: https://github.com/perso/flutter_rust_ocr/issues

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  meta: ^1.11.0
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      web:
        pluginClass: FlutterRustOcrWeb
        fileName: flutter_rust_ocr_web.dart
